<!doctype html><meta charset="utf-8"><title>zxtalori browser parity</title>
<style>body{background:#17212b;color:#e5edf5;font:14px/1.6 monospace;margin:30px}pre{white-space:pre-wrap}</style>
<h1>Browser / f64 generation regression</h1><pre id="report">Running actual browser WebGPU/WASM engine…</pre>
<script type="module">
import {Zxtalori} from '/engine/zxtalori.js';
const output=document.querySelector('#report'),report={cases:[],passed:false};
try {
  report.stage='Read reference data';
  const reference=await(await fetch('/qa/reference.json?fixture=2',{cache:'no-store'})).json();
  report.stage='Create browser GPU/WASM engine';
  const engine=await Zxtalori.create();
  report.stage='Generate and compare grids';
  for(const [key,expected] of Object.entries(reference)){
    const [group,h]=key.split('_'),id={T:8,O:9,I:10}[group];
    const snapshot=await engine.generate(id,+h,2048);
    const q=snapshot.quaternions;
    let maximum=0,worst=-1;
    for(let i=0;i<expected.length;i++){
      let distance=0;for(let k=0;k<4;k++)distance+=(q[i*4+k]-expected[i][k])**2;
      distance=Math.sqrt(distance);if(distance>maximum){maximum=distance;worst=i;}
    }
    const result={group,h:+h,count:q.length/4,expected_count:expected.length,maximum_quaternion_error:maximum,worst_index:worst,passed:q.length===4*expected.length&&maximum<3e-6};
    report.cases.push(result);output.textContent=JSON.stringify(report,null,2);
  }
  const imported=Float32Array.from({length:116},(_,i)=>Math.sin(i*1.71+.38)+Math.cos(i*.13));
  const normalized=(await engine.set(10,imported)).quaternions;
  const scaled=Float32Array.from(imported,(x,i)=>x*10**(-8+40*Math.floor(i/4)/28));
  const rescaled=(await engine.set(10,scaled)).quaternions;
  let importError=0;
  for(let i=0;i<normalized.length;i++)importError=Math.max(importError,Math.abs(normalized[i]-rescaled[i]));
  const extreme=new Float32Array([1,1,1,1,1,.1,.3,.4]);
  const extremeNormalized=(await engine.set(0,extreme)).quaternions;
  const extremeRescaled=(await engine.set(0,Float32Array.from(extreme,x=>x*3e38))).quaternions;
  for(let i=0;i<extreme.length;i++)importError=Math.max(importError,Math.abs(extremeNormalized[i]-extremeRescaled[i]));
  report.import_scale_invariance={maximum_component_error:importError,passed:importError<5e-7};
  await engine.generate(9,6,2048);
  const initial=(await engine.measure()).stats;
  const moved=(await engine.relax(2)).stats;
  const refreshed=(await engine.measure()).stats;
  report.measures={
    initial_log_ratio:initial.log_ratio,
    initial_quey_energy:initial.quey_energy,
    relaxed_quey_energy:moved.quey_energy,
    refreshed_log_ratio:refreshed.log_ratio,
    refreshed_separation_deg:refreshed.separation_deg,
    passed:Math.abs(initial.log_ratio-0.2775034)<2e-5 &&
      moved.iteration===2 && moved.quey_energy<initial.quey_energy &&
      moved.energy_ratios_current===false && moved.log_ratio===null &&
      refreshed.energy_ratios_current===true && Number.isFinite(refreshed.log_ratio)
  };
  report.stage='Exact counts, fixed identity and seam folding';report.exact_counts=[];
  for(let id=0;id<11;id++){
    const started=performance.now();
    await engine.generateExact(id,1000,{identity:true});await engine.identity({fixed:true});
    const snapshot=await engine.relax(12),q=snapshot.quaternions,ops=snapshot.operations,identity=snapshot.stats.identity_index;
    let excess=0;for(let i=0;i<q.length;i+=4)for(let k=0;k<ops.length;k+=4){let dot=0;for(let j=0;j<4;j++)dot+=q[i+j]*ops[k+j];excess=Math.max(excess,Math.abs(dot)-q[i]);}
    const fixed=identity!==null&&q[identity*4]===1&&q[identity*4+1]===0&&q[identity*4+2]===0&&q[identity*4+3]===0;
    report.exact_counts.push({group:snapshot.stats.group,count:q.length/4,maximum_zone_excess:excess,fixed_identity:fixed,separation_deg:snapshot.stats.separation_deg,milliseconds:performance.now()-started,passed:q.length===4000&&excess<1e-6&&fixed&&snapshot.stats.separation_deg>1});
    output.textContent=JSON.stringify(report,null,2);
  }
  report.upper_exact_counts=[];
  for(const id of [4,8,9,10]){
    const started=performance.now();await engine.generateExact(id,10000,{identity:true});await engine.identity({fixed:true});const snapshot=await engine.relax(2);
    report.upper_exact_counts.push({group:snapshot.stats.group,count:snapshot.quaternions.length/4,milliseconds:performance.now()-started,separation_deg:snapshot.stats.separation_deg,passed:snapshot.quaternions.length===40000&&snapshot.stats.separation_deg>1});
    output.textContent=JSON.stringify(report,null,2);
  }
  report.thin_shell_counts=[];
  for(const [id,count] of [[3,84],[5,62],[5,84],[6,84]]){
    const snapshot=await engine.generateExact(id,count,{identity:true});report.thin_shell_counts.push({group:snapshot.stats.group,count:snapshot.quaternions.length/4,passed:snapshot.quaternions.length===count*4});
  }
  report.stage='GPU covering against full-orbit Qhull';report.covering=[];
  await engine.identity({fixed:false});
  const coveringReference=await(await fetch('/qa/covering-reference.json',{cache:'no-store'})).json();
  for(const [id,[group,expected]] of Object.entries(coveringReference).entries()){
    const generated=await engine.generate(id,2,100);
    const start=performance.now(),measured=(await engine.covering()).stats;
    await engine.relax(1);const stale=(await engine.snapshot()).stats;
    const current=(await engine.covering()).stats;
    report.covering.push({group,count:expected.count,radius_deg:measured.covering_radius_deg,oracle_radius_deg:expected.radius_deg,milliseconds:performance.now()-start,
      passed:generated.quaternions.length===4*expected.count&&Math.abs(measured.covering_radius_deg-expected.radius_deg)<2e-4&&measured.covering_current&&!stale.covering_current&&current.covering_current&&current.covering_iteration===1&&current.triangulation_backend==='wgsl'});
    output.textContent=JSON.stringify(report,null,2);
  }
  engine.destroy();report.passed=report.cases.every(x=>x.passed)&&report.measures.passed&&report.import_scale_invariance.passed&&report.exact_counts.every(x=>x.passed)&&report.upper_exact_counts.every(x=>x.passed)&&report.thin_shell_counts.every(x=>x.passed)&&report.covering.every(x=>x.passed);
  report.stage='Complete';
} catch(error){report.error=String(error);}
output.textContent=JSON.stringify(report,null,2);
</script>
